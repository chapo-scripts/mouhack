name: Bundle Moonly Project

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest

    permissions:
      contents: write   # нужно для создания релиза

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download moonly CLI
        shell: pwsh
        run: |
          $url = "https://github.com/themusaigen/moonly-command-tool/releases/latest/download/moonly.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\moonly.exe"
          echo "$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run moonly bundle
        run: moonly bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundled-script
          path: dist/
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')   # только для тегов v*
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.lua
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}